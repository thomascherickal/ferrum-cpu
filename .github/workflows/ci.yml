name: CI

on:
  push:
    # Solo repo, no PRs: feature branches get CI on every push.
    branches: [main, master, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build workspace
        run: cargo build --workspace --locked
      # Debug profile here; the local battery (CLAUDE.md) uses --release.
      - name: Run tests
        run: cargo test --workspace --locked

  lint:
    name: Lint (clippy, rustfmt, JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
      - name: rustfmt (workspace)
        run: cargo fmt --all -- --check
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rustdoc (warnings are errors)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: JavaScript syntax check
        run: |
          for f in ferrum_gui/ui/*.js; do node --check "$f"; done

  msrv:
    name: MSRV (Rust 1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with `rust-version` in [workspace.package] (Cargo.toml).
      - uses: dtolnay/rust-toolchain@1.87
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
      - name: cargo check (workspace, MSRV)
        run: cargo check --workspace --locked

  python:
    name: Python tests (eval/lighteval)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Deliberately WITHOUT `pip install -r eval/lighteval/requirements.txt`:
      # it pulls LightEval and the torch CPU wheel (hundreds of MB). The tests
      # that need LightEval skip themselves (31 pass / 18 skip), and the rest
      # cover run.sh, summarize.py and the task-data builder. The full 49-test
      # run needs that install and is done locally.
      - name: Run the Python tests
        run: python -m unittest discover -s eval/lighteval -p 'test_*.py'

  deny:
    name: cargo-deny (advisories, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny (workspace)
        run: cargo deny check
      - name: cargo-deny (ferrum_gui)
        run: cargo deny --manifest-path ferrum_gui/Cargo.toml check

  wasm:
    name: Build (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
      # X2: slm_wasm is a workspace member, so `cargo build --workspace` already
      # compiles it natively; this job also verifies it compiles for wasm32.
      - name: Build WASM bindings
        run: cargo build -p slm_wasm --target wasm32-unknown-unknown --release --locked
      - name: Clippy (wasm32)
        run: cargo clippy -p slm_wasm --target wasm32-unknown-unknown --tests --locked -- -D warnings
      # W3: run the wasm module itself under Node. The runner must match the wasm-bindgen
      # crate in Cargo.lock (0.2.122). It is installed into a private root so it can be cached.
      - name: Cache wasm-bindgen-cli
        id: wbg
        uses: actions/cache@v4
        with:
          path: ~/.cargo/wbg
          key: ${{ runner.os }}-wasm-bindgen-cli-0.2.122
      - name: Install wasm-bindgen-cli 0.2.122
        if: steps.wbg.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.122 --locked --root ~/.cargo/wbg
      - name: Test the wasm module under Node (wasm-bindgen-test)
        run: |
          export CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER="$HOME/.cargo/wbg/bin/wasm-bindgen-test-runner"
          cargo test -p slm_wasm --target wasm32-unknown-unknown --release --locked --test node
      - name: Demo JavaScript (syntax and Node tests, no dependencies)
        run: |
          for f in slm_wasm/demo/*.js; do node --check "$f"; done
          for t in slm_wasm/demo/*.test.js; do node "$t" || exit 1; done

  gui:
    name: Build & test (ferrum_gui, Tauri)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # X1: ferrum_gui is its own crate (heavy webkit deps) and is excluded from
      # the workspace, so it needs a dedicated job to stay covered by CI.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ferrum_gui/target
          key: ${{ runner.os }}-cargo-gui-${{ hashFiles('**/Cargo.lock') }}
      - name: rustfmt (ferrum_gui)
        working-directory: ferrum_gui
        run: cargo fmt -- --check
      - name: Clippy (ferrum_gui)
        working-directory: ferrum_gui
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo check (all targets)
        working-directory: ferrum_gui
        run: cargo check --all-targets --locked
      - name: Run backend command tests
        working-directory: ferrum_gui
        run: cargo test --locked
      - name: Run UI tests (Node, no dependencies)
        run: for t in ferrum_gui/ui/*.test.js; do node "$t" || exit 1; done
      # CI5: does the app start at all? Build it (the cache above already holds the dependencies),
      # run it under a virtual X display for 8 s, require that its window opens and that the
      # process is still running; then stop it. This starts the real webview, but nothing clicks
      # and nothing reads the page: it cannot say that a tab works, only that the window comes up
      # and the process does not crash or exit.
      - name: Install a virtual display (xvfb)
        run: sudo apt-get install -y xvfb x11-utils dbus dbus-x11
      - name: Build the app (debug)
        working-directory: ferrum_gui
        run: cargo build --locked
      - name: Boot smoke test (xvfb, 8 s)
        working-directory: ferrum_gui
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          NO_AT_BRIDGE: "1"
        run: |
          log="$RUNNER_TEMP/ferrum_gui_boot.log"
          # dbus-run-session gives GTK a session bus: without one the process stays up but the
          # app window is never created (only GDK's 10x10 client-leader window exists).
          xvfb-run -a --server-args="-screen 0 1280x800x24" dbus-run-session -- bash -c '
            target/debug/ferrum_gui > "$1" 2>&1 &
            pid=$!
            found=no
            for i in 1 2 3 4 5 6 7 8; do
              sleep 1
              if ! kill -0 "$pid" 2>/dev/null; then
                wait "$pid"; echo "::error::ferrum_gui exited after $i s (status $?)"; exit 1
              fi
              if [ "$found" = no ] && xwininfo -root -tree | grep -q "Ferrum SLM Studio"; then
                found=yes; echo "window titled Ferrum SLM Studio appeared after $i s"
              fi
            done
            if [ "$found" = no ]; then
              echo "::error::no window titled Ferrum SLM Studio after 8 s"; xwininfo -root -tree
              kill "$pid"; exit 1
            fi
            kill "$pid"; wait "$pid" 2>/dev/null; echo "still running after 8 s; stopped"
          ' _ "$log" || { echo "--- app output ---"; cat "$log"; exit 1; }
          echo "--- app output ---"; cat "$log"
          if grep -q "panicked at" "$log"; then echo "::error::the app panicked while running"; exit 1; fi

  runtimes:
    name: Runtimes (llama.cpp + Ollama)
    runs-on: ubuntu-latest
    env:
      # Pinned releases; the sha256 values are checked on every download.
      LLAMA_CPP_TAG: b11521
      LLAMA_CPP_URL: https://github.com/ggml-org/llama.cpp/releases/download/b11521/llama-b11521-bin-ubuntu-x64.tar.gz
      LLAMA_CPP_SHA256: 2fc996ee8d7c08b47d0ee9a57ab0cbde5e275fbfcfd7d67478384244c302d264
      OLLAMA_TAG: v0.40.2
      OLLAMA_URL: https://github.com/ollama/ollama/releases/download/v0.40.2/ollama-linux-amd64.tar.zst
      OLLAMA_SHA256: 726bee78706c281b0eeef00746efe51a044d71c592c3f0b195820707f31fdf04
      # A missing runtime is a failure, not a skip. LM Studio needs its desktop app, so it is
      # the one exemption (local pre-release runs must not set FERRUM_SKIP_LMSTUDIO).
      FERRUM_REQUIRE_RUNTIMES: "1"
      FERRUM_SKIP_LMSTUDIO: "1"
      FERRUM_VERIFY_RUNTIMES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-runtimes-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/cache@v4
        id: runtimes-cache
        with:
          path: ~/.local/opt
          key: runtimes-${{ env.LLAMA_CPP_TAG }}-${{ env.OLLAMA_TAG }}-${{ env.LLAMA_CPP_SHA256 }}-${{ env.OLLAMA_SHA256 }}
      - name: Install llama.cpp ${{ env.LLAMA_CPP_TAG }} and Ollama ${{ env.OLLAMA_TAG }} (sha256-pinned)
        if: steps.runtimes-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          command -v zstd >/dev/null || sudo apt-get install -y zstd
          mkdir -p ~/.local/opt/llama.cpp-$LLAMA_CPP_TAG ~/.local/opt/ollama-$OLLAMA_TAG
          curl -fL --retry 3 -o "$RUNNER_TEMP/llama.tar.gz" "$LLAMA_CPP_URL"
          echo "$LLAMA_CPP_SHA256  $RUNNER_TEMP/llama.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/llama.tar.gz" --strip-components=1 -C ~/.local/opt/llama.cpp-$LLAMA_CPP_TAG
          curl -fL --retry 3 -o "$RUNNER_TEMP/ollama.tar.zst" "$OLLAMA_URL"
          echo "$OLLAMA_SHA256  $RUNNER_TEMP/ollama.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C ~/.local/opt/ollama-$OLLAMA_TAG
          rm -f "$RUNNER_TEMP/llama.tar.gz" "$RUNNER_TEMP/ollama.tar.zst"
      - name: Put the runtimes on PATH and start ollama serve
        run: |
          set -euo pipefail
          echo "$HOME/.local/opt/ollama-$OLLAMA_TAG/bin" >> "$GITHUB_PATH"
          echo "FERRUM_LLAMA_BIN=$HOME/.local/opt/llama.cpp-$LLAMA_CPP_TAG" >> "$GITHUB_ENV"
          nohup "$HOME/.local/opt/ollama-$OLLAMA_TAG/bin/ollama" serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 60); do curl -sf http://127.0.0.1:11434/ >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/ollama.log"; exit 1
      - name: Runtime compatibility tests (llama.cpp, Ollama; LM Studio exempt)
        run: cargo test --release --locked -p integration_tests --test test_runtime_compat -- --nocapture --test-threads 1
