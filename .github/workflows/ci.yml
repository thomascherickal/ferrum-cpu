name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build workspace
        run: cargo build --workspace --locked
      # Debug profile here; the local battery (CLAUDE.md) uses --release.
      - name: Run tests
        run: cargo test --workspace --locked

  lint:
    name: Lint (clippy, rustfmt, JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
      - name: rustfmt (workspace)
        run: cargo fmt --all -- --check
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rustdoc (warnings are errors)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: JavaScript syntax check
        run: |
          node --check ferrum_gui/ui/app.js
          node --check ferrum_gui/ui/stream.js
          node --check ferrum_gui/ui/stream.test.js

  msrv:
    name: MSRV (Rust 1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with `rust-version` in [workspace.package] (Cargo.toml).
      - uses: dtolnay/rust-toolchain@1.87
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
      - name: cargo check (workspace, MSRV)
        run: cargo check --workspace --locked

  deny:
    name: cargo-deny (advisories, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny (workspace)
        run: cargo deny check
      - name: cargo-deny (ferrum_gui)
        run: cargo deny --manifest-path ferrum_gui/Cargo.toml check --config deny.toml

  wasm:
    name: Build (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
      # X2: slm_wasm is a workspace member, so `cargo build --workspace` already
      # compiles it natively; this job also verifies it compiles for wasm32.
      - name: Build WASM bindings
        run: cargo build -p slm_wasm --target wasm32-unknown-unknown --release --locked
      - name: Clippy (wasm32)
        run: cargo clippy -p slm_wasm --target wasm32-unknown-unknown --locked -- -D warnings

  gui:
    name: Build & test (ferrum_gui, Tauri)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # X1: ferrum_gui is its own crate (heavy webkit deps) and is excluded from
      # the workspace, so it needs a dedicated job to stay covered by CI.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ferrum_gui/target
          key: ${{ runner.os }}-cargo-gui-${{ hashFiles('**/Cargo.lock') }}
      - name: rustfmt (ferrum_gui)
        working-directory: ferrum_gui
        run: cargo fmt -- --check
      - name: Clippy (ferrum_gui)
        working-directory: ferrum_gui
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo check (all targets)
        working-directory: ferrum_gui
        run: cargo check --all-targets --locked
      - name: Run backend command tests
        working-directory: ferrum_gui
        run: cargo test --locked
      - name: Run UI stream-reconciliation tests
        run: node ferrum_gui/ui/stream.test.js

  runtimes:
    name: Runtimes (llama.cpp + Ollama)
    runs-on: ubuntu-latest
    env:
      # Pinned releases; the sha256 values are checked on every download.
      LLAMA_CPP_TAG: b11521
      LLAMA_CPP_URL: https://github.com/ggml-org/llama.cpp/releases/download/b11521/llama-b11521-bin-ubuntu-x64.tar.gz
      LLAMA_CPP_SHA256: 2fc996ee8d7c08b47d0ee9a57ab0cbde5e275fbfcfd7d67478384244c302d264
      OLLAMA_TAG: v0.40.2
      OLLAMA_URL: https://github.com/ollama/ollama/releases/download/v0.40.2/ollama-linux-amd64.tar.zst
      OLLAMA_SHA256: 726bee78706c281b0eeef00746efe51a044d71c592c3f0b195820707f31fdf04
      # A missing runtime is a failure, not a skip. LM Studio needs its desktop app, so it is
      # the one exemption (local pre-release runs must not set FERRUM_SKIP_LMSTUDIO).
      FERRUM_REQUIRE_RUNTIMES: "1"
      FERRUM_SKIP_LMSTUDIO: "1"
      FERRUM_VERIFY_RUNTIMES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-runtimes-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/cache@v4
        id: runtimes-cache
        with:
          path: ~/.local/opt
          key: runtimes-${{ env.LLAMA_CPP_TAG }}-${{ env.OLLAMA_TAG }}-${{ env.LLAMA_CPP_SHA256 }}-${{ env.OLLAMA_SHA256 }}
      - name: Install llama.cpp ${{ env.LLAMA_CPP_TAG }} and Ollama ${{ env.OLLAMA_TAG }} (sha256-pinned)
        if: steps.runtimes-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          command -v zstd >/dev/null || sudo apt-get install -y zstd
          mkdir -p ~/.local/opt/llama.cpp-$LLAMA_CPP_TAG ~/.local/opt/ollama-$OLLAMA_TAG
          curl -fL --retry 3 -o "$RUNNER_TEMP/llama.tar.gz" "$LLAMA_CPP_URL"
          echo "$LLAMA_CPP_SHA256  $RUNNER_TEMP/llama.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/llama.tar.gz" --strip-components=1 -C ~/.local/opt/llama.cpp-$LLAMA_CPP_TAG
          curl -fL --retry 3 -o "$RUNNER_TEMP/ollama.tar.zst" "$OLLAMA_URL"
          echo "$OLLAMA_SHA256  $RUNNER_TEMP/ollama.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C ~/.local/opt/ollama-$OLLAMA_TAG
          rm -f "$RUNNER_TEMP/llama.tar.gz" "$RUNNER_TEMP/ollama.tar.zst"
      - name: Put the runtimes on PATH and start ollama serve
        run: |
          set -euo pipefail
          echo "$HOME/.local/opt/ollama-$OLLAMA_TAG/bin" >> "$GITHUB_PATH"
          echo "FERRUM_LLAMA_BIN=$HOME/.local/opt/llama.cpp-$LLAMA_CPP_TAG" >> "$GITHUB_ENV"
          nohup "$HOME/.local/opt/ollama-$OLLAMA_TAG/bin/ollama" serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 60); do curl -sf http://127.0.0.1:11434/ >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/ollama.log"; exit 1
      - name: Runtime compatibility tests (llama.cpp, Ollama; LM Studio exempt)
        run: cargo test --release --locked -p integration_tests --test test_runtime_compat -- --nocapture --test-threads 1
